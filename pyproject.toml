[project]
name = "llm-speaker"
version = "0.1.0"
description = "Transcription and refinement pipeline for the ZMM dharma talk archive"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.32",
    "rich>=14",
]

[dependency-groups]
# faster-whisper (CTranslate2) on GPU needs CUDA 12 cuBLAS + cuDNN 9 libraries.
asr = [
    "faster-whisper>=1.2.1",
    "av>=15.1,<19",  # faster-whisper 1.2.1 passes metadata_errors, removed in av 19
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
eval = [
    "jiwer>=4.0",
    "whisper-normalizer>=1.0",
]

[tool.uv]
default-groups = ["asr", "eval"]
package = false
