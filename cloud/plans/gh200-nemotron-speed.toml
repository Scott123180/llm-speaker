# Nemotron 3.5 (4-bit GGUF) throughput on a GH200 (96 GB HBM3, ARM64), to compare cost per audio
# hour with the A100 40 GB (259x with 32 requests + speculative decoding, about $50 for the archive;
# eval/findings.md item 21). Capacity is scarce: launch with --wait-capacity to keep trying.
# Every speech clip is sent 6 times (--repeat), so the GPU stays full with many requests in flight.
# Settings follow NeMo-Speech.cpp's docs/salm/configuration.md (80 GB+: many sequences, n_ctx 2048).
#   uv run python -m cloud run cloud/plans/gh200-nemotron-speed.toml --dry-run
name = "gh200-nemotron-speed"

[instance]
provider = "lambda"
types = ["gpu_1x_gh200"]
max_price_per_hour = 2.50
max_hours = 1.5
min_gpu_mem_gb = 90

[sync]
dirs = ["data/goldset/clips", "transcriber/context"]
results = ["data/logs"]

[setup]
commands = ["bash cloud/remote/bootstrap.sh"]

[[job]]
name = "nemotron-gh200"
models = ["AtomicChat/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B-GGUF:*Encoder-F16.gguf,*AD-IQ4_NL.gguf"]
setup = ["bash cloud/remote/setup_nemo_speech_cpp.sh cuda"]
commands = [
  "uv run python asr/throughput.py --label nemotron-gh200 --variant '32 requests, speculative' -- uv run python asr/run_nemotron_cpp.py --kinds speech --repeat 6 --concurrency 32 --salm max_sequences=32 --salm n_ctx_per_sequence=4096 --salm max_context=73728 --salm mtp_draft=7 --salm n_batch=4096 --salm encoder_max_batch=32",
  "uv run python asr/throughput.py --label nemotron-gh200 --variant '64 requests, speculative' -- uv run python asr/run_nemotron_cpp.py --kinds speech --repeat 6 --concurrency 64 --salm max_sequences=64 --salm n_ctx_per_sequence=2048 --salm max_context=73728 --salm mtp_draft=7 --salm n_batch=8192 --salm encoder_max_batch=64",
  "uv run python asr/throughput.py --label nemotron-gh200 --variant '128 requests, speculative' -- uv run python asr/run_nemotron_cpp.py --kinds speech --repeat 6 --concurrency 128 --salm max_sequences=128 --salm n_ctx_per_sequence=2048 --salm max_context=73728 --salm mtp_draft=7 --salm n_batch=16384 --salm encoder_max_batch=128",
]
